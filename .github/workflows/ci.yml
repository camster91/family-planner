name: CI Build

# Canonical pull-request verification workflow. Keeps lint, formatting,
# tests, migration checks, audit and build in one run to reduce Actions fan-out.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
        env:
          CI: true

      - name: Test
        run: npm test -- --ci --runInBand --no-watchman

      - name: Verify database migrations are idempotent
        run: |
          node scripts/migrate.js
          node scripts/migrate.js
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/familyplanner_ci

      - name: Test persisted family imports
        run: npx jest src/lib/imports/__tests__/persistence.integration.test.ts --ci --runInBand --no-watchman --forceExit
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/familyplanner_ci
          RUN_DB_INTEGRATION: "1"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          CI: true
