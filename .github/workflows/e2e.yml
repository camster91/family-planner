      - name: Expanded guarded inventory journeys
        run: npx playwright test e2e/inventory-localization.spec.ts --project=phone-390x844 --project=tablet-portrait-800x1280 --project=fridge-landscape-1280x800
        env:
          E2E_SKIP_BUILD: "1"
