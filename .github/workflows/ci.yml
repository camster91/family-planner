name: Ashbi Release Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ashbi-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Ashbi release gate
    # Pull-request code runs only on an ephemeral GitHub-hosted runner. Trusted
    # master/manual runs retain the full host-local rollback proof on Ashbi.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'family-planner' }}
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Immutable image currently running in production. Update only after a
      # separately approved deployment and verified rollback-window close.
      ROLLBACK_IMAGE: ${{ github.event_name == 'pull_request' && '' || 'family-planner@sha256:7520c08a82282a450c40469830c09cb8712cc936fd568a1b5556b519fcdca698' }}
      REQUIRE_ROLLBACK: ${{ github.event_name == 'pull_request' && '0' || '1' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Record candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "Candidate: $CANDIDATE_SHA"

      - name: Setup supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Run complete release gate
        run: bash scripts/ci-gate.sh

      - name: Remove disposable CI resources
        if: always()
        run: bash scripts/ci-cleanup.sh "$GITHUB_RUN_ID"

      - name: Publish evidence summary
        if: always()
        run: |
          {
            echo "## Ashbi release gate"
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Gate: frozen install, Prisma generation, typecheck, lint, tests, migration twice, persisted import integration, backup/restore rehearsal, production audit, application build, image build, container health smoke, role-aware parent-to-child core loop, and host-local immutable-image rollback smoke on trusted runs"
          } >> "$GITHUB_STEP_SUMMARY"
