name: Ashbi Review Target

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only target operation
        required: true
        type: choice
        default: inspect
        options:
          - inspect

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect review target
    runs-on: [self-hosted, linux, x64, ashbi, family-planner]
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Inspect sanitized review topology
        run: bash scripts/inspect-review-target.sh
