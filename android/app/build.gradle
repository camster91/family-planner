apply plugin: 'com.android.application'

// Versioning (docs/architecture/ANDROID.md, "Versioning policy", ADR-0004).
// CI passes -PfpVersionCode / -PfpVersionName (or FP_VERSION_CODE /
// FP_VERSION_NAME): apk.yml uses the workflow run number for the code and the
// v<MAJOR.MINOR.PATCH> tag for the name. A local build without them gets the
// defaults below and must never be distributed.
def fpVersionInput = { String property, String envName, String fallback ->
    def value = project.findProperty(property) ?: System.getenv(envName)
    return value?.toString()?.trim() ? value.toString().trim() : fallback
}
def fpVersionCode = fpVersionInput('fpVersionCode', 'FP_VERSION_CODE', '1')
def fpVersionName = fpVersionInput('fpVersionName', 'FP_VERSION_NAME', '1.0')
// Play's ceiling for versionCode is 2100000000.
if (!(fpVersionCode ==~ /[1-9][0-9]{0,9}/) || fpVersionCode.toLong() > 2100000000L) {
    throw new GradleException("fpVersionCode must be an integer from 1 to 2100000000, got '${fpVersionCode}'")
}
if (!(fpVersionName ==~ /[0-9][0-9A-Za-z.+-]{0,31}/)) {
    throw new GradleException("fpVersionName must be 1-32 characters [0-9A-Za-z.+-] starting with a digit, got '${fpVersionName}'")
}

android {
    namespace = "com.ashbi.familyplanner"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ashbi.familyplanner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode fpVersionCode.toInteger()
        versionName fpVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is configured only when every signing environment
    // variable is present (CI decodes the keystore from a repository secret).
    // Without them `assembleRelease` still produces an *unsigned* APK, which
    // must not be distributed. Never commit a keystore or its passwords.
    def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it?.trim() }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.all {
            // JVM tests in src/test read the manifest, res/xml and Capacitor config from disk.
            systemProperty 'familyplanner.appDir', projectDir.absolutePath
            // Declare them as inputs so a config change re-runs the tests instead of UP-TO-DATE.
            inputs.files('src/main/AndroidManifest.xml', 'src/main/assets/capacitor.config.json', '../../capacitor.config.ts')
                .withPropertyName('securityConfigFiles')
            inputs.dir('src/main/res/xml').withPropertyName('securityXmlResources')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
