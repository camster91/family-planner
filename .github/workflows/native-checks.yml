name: Native Android checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and unsigned build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Sync native plugins and recovery assets
        run: npx cap sync android
      - name: Test and build without signing or publishing
        working-directory: android
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestJavaWithJavac assembleRelease bundleRelease
