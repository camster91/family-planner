# Secret scanning config for gitleaks (#136). CI runs it in `Build & Test`
# (.github/workflows/release.yml, "Scan for secrets"); locally:
#   gitleaks dir . --redact --verbose
#
# The default gitleaks rules apply. The allowlist below is deliberately narrow:
# it only skips the `generic-api-key` rule, only in test files, and only for
# values shaped like fake idempotency keys or one exact disposable device
# fixture. An idempotency key is a client-chosen retry id (a random UUID in the
# app), not a credential. The device fixture is scoped separately below.
# Anything else that looks like a secret still fails the build.
#
# Adding an entry: keep it to one rule, test paths and a value pattern, and say
# why it is not a secret. Never allowlist a real credential; rotate it instead.

[extend]
useDefault = true

[[allowlists]]
description = "Fake Idempotency-Key values in unit/integration tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/.*/__tests__/[^/]+\.test\.ts$''']
regexTarget = "secret"
regexes = [
  # UUID-shaped keys, e.g. src/lib/__tests__/idempotency.test.ts,
  # src/lib/__tests__/idempotency.integration.test.ts,
  # src/app/api/users/__tests__/deletion.test.ts
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
  # src/lib/__tests__/device-queue-send.test.ts
  '''^key-[0-9]{4}-[a-z]+$''',
]

[[allowlists]]
description = "Disposable local-only Anniversary browser device fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^e2e/anniversaries-role-alignment\.spec\.ts$''']
regexTarget = "secret"
# This literal is hashed into a guarded disposable fixture database and removed
# by the role journey. It is never a production device credential. Match only
# this exact test value; all other values and paths retain the default scan.
regexes = ['''^fpd1_a_e2e_anniversaries_valid$''']


[[allowlists]]
description = "Plain-language calendar review test title; no credential or fixture value"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/lib/calendar-planning/__tests__/conflict-review\.test\.ts$''']
regexTarget = "line"
# The default generic-key rule interprets the words after 'tokens' in this
# one test title as a value. Match this exact title only, including it(...).
# Other lines, test values and secret rules remain fully scanned.
regexes = ['''it\("refuses\ foreign\ owners,\ stale\ tokens,\ unknown/duplicate\ references\ and\ out\-of\-range\ windows",\ \(\)\ =>\ \{''']

[[allowlists]]
description = "Exact fake untimed reward retry ID in the legacy recovery test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/app/dashboard/rewards/__tests__/create-form\.test\.tsx$''']
regexTarget = "secret"
# Client retry identifier only; this test never authenticates with it.
# Exact historical fixture value only, so the full PR history stays scanned.
regexes = ['''^legacy\-reward\-key\-12345678$''']

[[allowlists]]
description = "Exact historical implementation prose; contains no credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/engineering/ISSUE_COMPLETION_LEDGER\.md$''']
regexTarget = "line"
regexes = ['''(?m)^\+?reply,\ same\-body/key\ recovery,\ default/normalized\ list\ and\ caller\-mutation\ cases$''']

[[allowlists]]
description = "Exact historical implementation prose; contains no credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/CURRENT_STATE\.md$''']
regexTarget = "line"
regexes = ['''(?m)^\+?reply,\ same\-body/key\ recovery,\ default/normalized\ list\ and\ caller\-mutation\ cases$''']

[[allowlists]]
description = "Exact historical implementation prose; contains no credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/plans/import\-review\-ui\.md$''']
regexTarget = "line"
regexes = ['''(?m)^\+?The\ API\ path,\ body\ keys,\ parent/family\ guards,\ identity\ checks,\ importer\ ownership,$''']
