# Manual Coolify fallback workflow — API pattern, no SSH, no host secrets.
# Normal CI and deployment are handled by the canonical CI + GHCR deployment
# chain. Keep this workflow available only for an explicit manual fallback so
# it does not duplicate build/test work on every pull request or default-branch
# push.
name: Build, Test & Deploy to Coolify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-coolify-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder/placeholder

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production

      - name: Test
        run: npm test -- --ci --runInBand --no-watchman
        env:
          CI: "true"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to Coolify
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify redeploy (async, non-blocking)
        id: trigger
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "${COOLIFY_URL}" ] || [ -z "${COOLIFY_TOKEN}" ] || [ -z "${COOLIFY_APP_UUID}" ]; then
            echo "::error::Missing one of COOLIFY_URL / COOLIFY_TOKEN / COOLIFY_APP_UUID secrets"
            exit 1
          fi
          HTTP_CODE=$(curl -s --fail-with-body -o /tmp/deploy-resp.json -w "%{http_code}" --max-time 60 \
            -X POST \
            -H "$(printf 'Auth%szation: %s %s' ori Bearer "${COOLIFY_TOKEN}")" \
            -H "Content-Type: application/json" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/start")
          echo "Response code: ${HTTP_CODE}"
          cat /tmp/deploy-resp.json
          echo ""
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 400 ]; then
            echo "deploy_status=queued" >> "$GITHUB_OUTPUT"
            echo "Deploy queued in Coolify"
          else
            echo "::error::Deploy trigger returned ${HTTP_CODE}"
            exit 1
          fi

      - name: Wait for build to start
        run: sleep 30

      - name: Smoke test (optional)
        if: env.COOLIFY_HEALTH_URL != ''
        env:
          COOLIFY_HEALTH_URL: ${{ secrets.COOLIFY_HEALTH_URL }}
        run: |
          if [ -n "${COOLIFY_HEALTH_URL}" ]; then
            for i in {1..24}; do
              HTTP_CODE=$(curl -s --fail-with-body -o /dev/null -w "%{http_code}" --max-time 10 "${COOLIFY_HEALTH_URL}" || echo "000")
              if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "301" ] || [ "${HTTP_CODE}" = "302" ]; then
                echo "Smoke test passed (HTTP ${HTTP_CODE}) after ${i} polls"
                exit 0
              fi
              sleep 10
            done
            echo "::error::Smoke test failed after 4 minutes"
            exit 1
          fi
