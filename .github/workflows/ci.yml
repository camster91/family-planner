name: Ashbi Release Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ashbi-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Ashbi release gate
    runs-on: [self-hosted, linux, x64, ashbi, family-planner]
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Candidate: $GITHUB_SHA"

      - name: Setup supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Run complete release gate
        run: bash scripts/ci-gate.sh

      - name: Publish evidence summary
        if: always()
        run: |
          {
            echo "## Ashbi release gate"
            echo "- Candidate: \`$GITHUB_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Gate: frozen install, Prisma generation, typecheck, lint, tests, migration twice, persisted import integration, production audit, application build, image build, and container health smoke"
          } >> "$GITHUB_STEP_SUMMARY"
