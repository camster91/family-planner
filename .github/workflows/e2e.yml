name: E2E (Playwright)

# Browser journeys, accessibility smoke and visual snapshots (#155).
# Informational: this workflow is not a required check unless branch
# protection is changed to require it. See docs/testing/E2E.md.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate visual baselines on the CI runner and upload them as an artifact (never commits)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: family-planner-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E viewport shard (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Each job owns a fresh service database and auth files. Keep one worker
    # within a shard: existing specs deliberately mutate canonical fixtures.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: phone-390
            projects: --project=phone-390x844
          - group: phone-430
            projects: --project=phone-430x932
          - group: portrait-tablet
            projects: --project=tablet-portrait-800x1280
          - group: fridge-landscape
            projects: --project=fridge-landscape-1280x800
          - group: large-tablet
            projects: --project=tablet-large-1920x1200
          - group: desktop
            projects: --project=desktop-1366x768
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Disposable database for this isolated, ephemeral hosted job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fp_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fp_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Loopback + disposable name: accepted by the fixture guard (src/lib/fixtures/guard.ts).
      DATABASE_URL: postgresql://postgres@localhost:5432/fp_e2e_ci
      FIXTURES_ALLOW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Migrate database
        run: node scripts/migrate.js

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production

      # Global setup seeds the fixtures (npm run fixtures:seed) before each run.
      # Explicit manual snapshot generation produces review artifacts only.
      # Ordinary PR/main runs retain the full acceptance journeys.
      - name: Journeys and accessibility smoke
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_snapshots != true }}
        run: npx playwright test ${{ matrix.projects }} --grep-invert @visual
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/journeys
          E2E_OUTPUT_DIR: test-results/journeys

      - name: Visual snapshots
        if: ${{ !cancelled() && inputs.update_snapshots != true }}
        run: npx playwright test ${{ matrix.projects }} --grep @visual
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/visual
          E2E_OUTPUT_DIR: test-results/visual

      - name: Regenerate visual baselines
        if: ${{ !cancelled() && inputs.update_snapshots == true }}
        run: npx playwright test ${{ matrix.projects }} --grep @visual --update-snapshots=all
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/visual
          E2E_OUTPUT_DIR: test-results/visual

      - name: Upload regenerated baselines
        if: ${{ !cancelled() && inputs.update_snapshots == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-baselines-${{ matrix.group }}-${{ github.sha }}
          path: e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 7

      # Reports contain only synthetic fixture data (#154).
      - name: Upload Playwright report
        # Preserve partial proof when the runner's job deadline cancels a shard.
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.group }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # JSON reporter bodies retain inline feature PNGs and runtime metadata.
      # They are not individual test-results files; preserve this report rather
      # than uploading filename globs that cannot match body attachments.
      - name: Preserve queue storage recovery captures
        if: ${{ !cancelled() && inputs.update_snapshots != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: queue-storage-recovery-${{ matrix.group }}-${{ github.sha }}
          path: |
            playwright-report/journeys/results.json
            test-results/**/*storage-paused.png
            test-results/**/*storage-recovered.png
            test-results/**/device-storage-recovery-*.png
            test-results/**/*queue-recovery-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload initial JavaScript budget measurements
        # Only these shards run the retained phone/desktop byte measurements.
        if: ${{ !cancelled() && inputs.update_snapshots != true && (matrix.group == 'phone-390' || matrix.group == 'desktop') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: initial-js-budget-${{ matrix.group }}-${{ github.sha }}
          path: test-results/**/initial-js-budget.json
          if-no-files-found: error
          retention-days: 7

      # These captures contain only synthetic product-quality fixture data.
      - name: Upload compact fridge metadata captures
        if: ${{ !cancelled() && inputs.update_snapshots != true && (matrix.group == 'fridge-landscape' || matrix.group == 'large-tablet' || matrix.group == 'desktop') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-quality-fridge-captures-${{ matrix.group }}-${{ github.sha }}
          path: test-results/**/product-quality-fridge-*.png
          if-no-files-found: error
          retention-days: 7

  recovery_expanded:
    name: Password recovery ordinary and expanded QA
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Independent QA build: public static pages capture expansion at build time.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Disposable database for this isolated, ephemeral hosted job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fp_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fp_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Loopback + disposable name: accepted by the fixture guard (src/lib/fixtures/guard.ts).
      DATABASE_URL: postgresql://postgres@localhost:5432/fp_e2e_ci
      FIXTURES_ALLOW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      I18N_PSEUDO_ENABLED: "1"
      DESIGN_GALLERY_ENABLED: "1"
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Migrate database
        run: node scripts/migrate.js

      - name: Build ordinary recovery application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
          I18N_PSEUDO_ENABLED: "0"
          DESIGN_GALLERY_ENABLED: "0"

      - name: Ordinary anonymous recovery journeys
        run: npx playwright test e2e/auth-recovery-localization.spec.ts e2e/email-confirmation-localization.spec.ts e2e/auth-entry-localization.spec.ts --project=phone-390x844 --project=tablet-portrait-800x1280 --project=fridge-landscape-1280x800 --no-deps
        env:
          E2E_SKIP_BUILD: "1"
          I18N_PSEUDO_ENABLED: "0"
          DESIGN_GALLERY_ENABLED: "0"
          E2E_REPORT_DIR: playwright-report/recovery-ordinary
          E2E_OUTPUT_DIR: test-results/recovery-ordinary

      - name: Build expanded recovery application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production

      - name: Expanded anonymous recovery journeys
        run: npx playwright test e2e/auth-recovery-localization.spec.ts e2e/email-confirmation-localization.spec.ts e2e/auth-entry-localization.spec.ts --project=phone-390x844 --project=tablet-portrait-800x1280 --project=fridge-landscape-1280x800 --no-deps
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/recovery-expanded
          E2E_OUTPUT_DIR: test-results/recovery-expanded

      # Every recovery POST is intercepted; screenshots contain fabricated values only.
      - name: Preserve ordinary and expanded recovery reports and captures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-qa-${{ github.sha }}
          path: |
            playwright-report/recovery-ordinary/
            test-results/recovery-ordinary/
            playwright-report/recovery-expanded/
            test-results/recovery-expanded/
          if-no-files-found: error
          retention-days: 7

