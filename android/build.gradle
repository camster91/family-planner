// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AndroidX and Cordova bring different Kotlin stdlib variants. Align them in
// every Android module, including generated plugin instrumented-test APKs.
// Keep this here because `cap sync` regenerates the Cordova module build file.
subprojects {
    ['com.android.application', 'com.android.library'].each { androidPlugin ->
        plugins.withId(androidPlugin) {
            dependencies.add('implementation', dependencies.platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'))
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
