name: Build, Test & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a production release. Build jobs have their own cancellable group.
concurrency:
  group: family-planner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: family-planner-build-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Disposable database for this isolated, ephemeral hosted job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: familyplanner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d familyplanner_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      image_id: ${{ steps.package-image.outputs.image_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test -- --ci --runInBand --no-watchman
        env:
          CI: "true"

      - name: Verify database migrations are idempotent
        run: |
          node scripts/migrate.js
          node scripts/migrate.js
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/familyplanner_ci

      - name: Test persisted family imports
        run: npx jest src/lib/imports/__tests__/persistence.integration.test.ts --ci --runInBand --no-watchman --forceExit
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/familyplanner_ci
          RUN_DB_INTEGRATION: "1"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Build container image
        run: docker build --pull --build-arg "RELEASE_SHA=${GITHUB_SHA}" --tag "family-planner:${GITHUB_SHA}" .

      - name: Smoke test container readiness
        run: |
          set -euo pipefail
          network="fp-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          database="fp-smoke-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          app="fp-smoke-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$app" "$database" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          # Throwaway database on the isolated smoke-test network.
          docker run --detach \
            --name "$database" \
            --network "$network" \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_DB=familyplanner_ci \
            postgres:17-alpine >/dev/null

          ready=0
          for _ in $(seq 1 60); do
            if docker exec "$database" pg_isready -U postgres -d familyplanner_ci >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::test database did not become ready"
            exit 1
          fi

          docker run --detach \
            --name "$app" \
            --network "$network" \
            --env DATABASE_URL="postgresql://postgres@${database}:5432/familyplanner_ci" \
            --env JWT_SECRET="${GITHUB_SHA}${GITHUB_SHA}" \
            --env NEXT_PUBLIC_APP_URL="http://family-planner.test" \
            "family-planner:${GITHUB_SHA}" >/dev/null

          healthy=0
          for _ in $(seq 1 120); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$app")"
            if [ "$state" = healthy ]; then
              healthy=1
              break
            fi
            if [ "$state" = unhealthy ]; then
              break
            fi
            sleep 5
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::container readiness smoke test failed; application logs remain on the ephemeral runner"
            exit 1
          fi

      - name: Package verified release image
        id: package-image
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        run: |
          set -euo pipefail
          image="family-planner:${GITHUB_SHA}"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected container image identity"
            exit 1
          fi
          release_dir="$RUNNER_TEMP/family-planner-release"
          mkdir -p "$release_dir"
          docker save --output "$release_dir/image.tar" "$image"
          cp .github/scripts/deploy-vps.sh "$release_dir/deploy-vps.sh"
          tar -czf "$release_dir/release-bundle.tar.gz" -C "$release_dir" image.tar deploy-vps.sh
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Upload verified release image
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: family-planner-release-${{ github.sha }}
          path: ${{ runner.temp }}/family-planner-release/release-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release to VPS
    needs: build
    # Production credentials are only available to a manually dispatched run on
    # the actual default branch. Pull requests and ordinary pushes never deploy.
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    concurrency:
      group: family-planner-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified release image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: family-planner-release-${{ github.sha }}
          path: ${{ runner.temp }}/family-planner-release

      - name: Deploy exact verified image over pinned SSH
        env:
          FP_SSH_HOST: ${{ vars.FP_SSH_HOST }}
          FP_SSH_USER: ${{ vars.FP_SSH_USER }}
          FP_SSH_PORT: ${{ vars.FP_SSH_PORT }}
          FP_SSH_PRIVATE_KEY: ${{ secrets.FP_SSH_PRIVATE_KEY }}
          FP_SSH_KNOWN_HOSTS: ${{ secrets.FP_SSH_KNOWN_HOSTS }}
          FP_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          bash ./.github/scripts/deploy-over-ssh.sh \
            "$GITHUB_SHA" \
            "$FP_IMAGE_ID" \
            "$RUNNER_TEMP/family-planner-release/release-bundle.tar.gz"

      - name: Verify public route serves the released commit
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          for attempt in $(seq 1 6); do
            : > "$headers"
            code="$(curl --silent --show-error --max-time 15 \
              --header 'Cache-Control: no-cache' \
              --dump-header "$headers" --output /dev/null \
              --write-out '%{http_code}' \
              https://family.ashbi.ca/api/health || true)"
            served_sha="$(awk 'tolower($1) == "x-release-commit:" { gsub("\r", "", $2); print $2 }' "$headers" | tail -n 1)"
            if [ "$code" = "200" ] && [ "$served_sha" = "$GITHUB_SHA" ]; then
              echo "Public health route serves verified commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::public health route did not serve the verified release commit"
          exit 1
