name: E2E (Playwright)

# Browser journeys, accessibility smoke and visual snapshots (#155).
# Informational: this workflow is not a required check unless branch
# protection is changed to require it. See docs/testing/E2E.md.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      cloudflare_only:
        description: "Build and measure the Cloudflare Worker only; no deployment or browser shards"
        type: boolean
        default: false
      retain_cloudflare_runtime:
        description: "Retain a seven-day local verification tar (Worker bundle and static assets only)"
        type: boolean
        default: false
      update_snapshots:
        description: "Regenerate visual baselines on the CI runner and upload them as an artifact (never commits)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: family-planner-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cloudflare_only != true }}
    name: E2E viewport shard (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Each job owns a fresh service database and auth files. Keep one worker
    # within a shard: existing specs deliberately mutate canonical fixtures.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: phone-390
            projects: --project=phone-390x844
          - group: phone-430
            projects: --project=phone-430x932
          - group: portrait-tablet
            projects: --project=tablet-portrait-800x1280
          - group: fridge-landscape
            projects: --project=fridge-landscape-1280x800
          - group: large-tablet
            projects: --project=tablet-large-1920x1200
          - group: desktop
            projects: --project=desktop-1366x768
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Disposable database for this isolated, ephemeral hosted job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fp_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fp_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Loopback + disposable name: accepted by the fixture guard (src/lib/fixtures/guard.ts).
      DATABASE_URL: postgresql://postgres@localhost:5432/fp_e2e_ci
      FIXTURES_ALLOW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Migrate database
        run: node scripts/migrate.js

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production

      # Global setup seeds the fixtures (npm run fixtures:seed) before each run.
      # Explicit manual snapshot generation produces review artifacts only.
      # Ordinary PR/main runs retain the full acceptance journeys.
      - name: Journeys and accessibility smoke
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_snapshots != true }}
        run: npx playwright test ${{ matrix.projects }} --grep-invert @visual
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/journeys
          E2E_OUTPUT_DIR: test-results/journeys

      - name: Visual snapshots
        if: ${{ !cancelled() && inputs.update_snapshots != true }}
        run: npx playwright test ${{ matrix.projects }} --grep @visual
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/visual
          E2E_OUTPUT_DIR: test-results/visual

      - name: Regenerate visual baselines
        if: ${{ !cancelled() && inputs.update_snapshots == true }}
        run: npx playwright test ${{ matrix.projects }} --grep @visual --update-snapshots=all
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/visual
          E2E_OUTPUT_DIR: test-results/visual

      - name: Upload regenerated baselines
        if: ${{ !cancelled() && inputs.update_snapshots == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-baselines-${{ matrix.group }}-${{ github.sha }}
          path: e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 7

      # Reports contain only synthetic fixture data (#154).
      - name: Upload Playwright report
        # Preserve partial proof when the runner's job deadline cancels a shard.
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.group }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # JSON reporter bodies retain inline feature PNGs and runtime metadata.
      # They are not individual test-results files; preserve this report rather
      # than uploading filename globs that cannot match body attachments.
      - name: Preserve queue storage recovery captures
        if: ${{ !cancelled() && inputs.update_snapshots != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: queue-storage-recovery-${{ matrix.group }}-${{ github.sha }}
          path: |
            playwright-report/journeys/results.json
            test-results/**/*storage-paused.png
            test-results/**/*storage-recovered.png
            test-results/**/device-storage-recovery-*.png
            test-results/**/*queue-recovery-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload initial JavaScript budget measurements
        # Only these shards run the retained phone/desktop byte measurements.
        if: ${{ !cancelled() && inputs.update_snapshots != true && (matrix.group == 'phone-390' || matrix.group == 'desktop') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: initial-js-budget-${{ matrix.group }}-${{ github.sha }}
          path: test-results/**/initial-js-budget.json
          if-no-files-found: error
          retention-days: 7

      # The compact metadata cases emit PNGs only at 1280x800 and 1366x768.
      # Keep missing captures an error for those two producer shards.
      - name: Upload compact fridge metadata captures
        if: ${{ !cancelled() && inputs.update_snapshots != true && (matrix.group == 'fridge-landscape' || matrix.group == 'desktop') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-quality-fridge-captures-${{ matrix.group }}-${{ github.sha }}
          path: test-results/**/product-quality-fridge-*.png
          if-no-files-found: error
          retention-days: 7

  recovery_expanded:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cloudflare_only != true }}
    name: Password recovery ordinary and expanded QA
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Independent QA build: public static pages capture expansion at build time.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Disposable database for this isolated, ephemeral hosted job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fp_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fp_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Loopback + disposable name: accepted by the fixture guard (src/lib/fixtures/guard.ts).
      DATABASE_URL: postgresql://postgres@localhost:5432/fp_e2e_ci
      FIXTURES_ALLOW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      I18N_PSEUDO_ENABLED: "1"
      DESIGN_GALLERY_ENABLED: "1"
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Migrate database
        run: node scripts/migrate.js

      - name: Build ordinary recovery application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
          I18N_PSEUDO_ENABLED: "0"
          DESIGN_GALLERY_ENABLED: "0"

      - name: Ordinary anonymous recovery journeys
        run: npx playwright test e2e/auth-recovery-localization.spec.ts e2e/email-confirmation-localization.spec.ts e2e/auth-entry-localization.spec.ts --project=phone-390x844 --project=tablet-portrait-800x1280 --project=fridge-landscape-1280x800 --no-deps
        env:
          E2E_SKIP_BUILD: "1"
          I18N_PSEUDO_ENABLED: "0"
          DESIGN_GALLERY_ENABLED: "0"
          E2E_REPORT_DIR: playwright-report/recovery-ordinary
          E2E_OUTPUT_DIR: test-results/recovery-ordinary

      - name: Build expanded recovery application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production

      - name: Expanded anonymous recovery journeys
        run: npx playwright test e2e/auth-recovery-localization.spec.ts e2e/email-confirmation-localization.spec.ts e2e/auth-entry-localization.spec.ts --project=phone-390x844 --project=tablet-portrait-800x1280 --project=fridge-landscape-1280x800 --no-deps
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/recovery-expanded
          E2E_OUTPUT_DIR: test-results/recovery-expanded

      # Every recovery POST is intercepted; screenshots contain fabricated values only.
      - name: Preserve ordinary and expanded recovery reports and captures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-qa-${{ github.sha }}
          path: |
            playwright-report/recovery-ordinary/
            test-results/recovery-ordinary/
            playwright-report/recovery-expanded/
            test-results/recovery-expanded/
          if-no-files-found: error
          retention-days: 7

  inventory_localization:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cloudflare_only != true }}
    name: Inventory ordinary and expanded QA
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fp_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fp_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/fp_e2e_ci
      FIXTURES_ALLOW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate database
        run: node scripts/migrate.js
      # The stub is enabled only for the server runs, never for compilation.
      - name: Build ordinary inventory application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
          I18N_PSEUDO_ENABLED: "0"
          DESIGN_GALLERY_ENABLED: "0"
      - name: Ordinary guarded inventory journeys
        run: npx playwright test e2e/inventory-localization.spec.ts --project=phone-390x844 --project=tablet-portrait-800x1280 --project=fridge-landscape-1280x800
        env:
          E2E_SKIP_BUILD: "1"
          E2E_INVENTORY_SCAN_STUB: "1"
          I18N_PSEUDO_ENABLED: "0"
          DESIGN_GALLERY_ENABLED: "0"
          E2E_REPORT_DIR: playwright-report/inventory-ordinary
          E2E_OUTPUT_DIR: test-results/inventory-ordinary
      - name: Build expanded inventory application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
          I18N_PSEUDO_ENABLED: "1"
          DESIGN_GALLERY_ENABLED: "1"
      - name: Expanded guarded inventory journeys
        run: npx playwright test e2e/inventory-localization.spec.ts --project=phone-390x844 --project=tablet-portrait-800x1280 --project=fridge-landscape-1280x800
        env:
          E2E_SKIP_BUILD: "1"
          E2E_INVENTORY_SCAN_STUB: "1"
          I18N_PSEUDO_ENABLED: "1"
          DESIGN_GALLERY_ENABLED: "1"
          E2E_REPORT_DIR: playwright-report/inventory-expanded
          E2E_OUTPUT_DIR: test-results/inventory-expanded
      - name: Preserve ordinary and expanded inventory proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inventory-qa-${{ github.sha }}
          path: |
            playwright-report/inventory-ordinary/
            test-results/inventory-ordinary/
            playwright-report/inventory-expanded/
            test-results/inventory-expanded/
          if-no-files-found: error
          retention-days: 7

  settings_localization:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cloudflare_only != true }}
    name: Settings ${{ matrix.mode }} QA
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Each build mode retains every enabled/unavailable journey and its own
    # disposable database. Sequential modes exceeded the unchanged job deadline.
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: ordinary
            expanded: "0"
          - mode: expanded
            expanded: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fp_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fp_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/fp_e2e_ci
      FIXTURES_ALLOW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_SHA: ${{ github.sha }}
      I18N_PSEUDO_ENABLED: ${{ matrix.expanded }}
      DESIGN_GALLERY_ENABLED: ${{ matrix.expanded }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Record source tree for runtime proof
        run: echo "E2E_SETTINGS_BUILD_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate database
        run: node scripts/migrate.js
      # Synthetic availability is installed only in the guarded server child, never compilation.
      - name: Build ${{ matrix.mode }} Settings application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
      - name: ${{ matrix.mode }} guarded Settings journeys
        run: npx playwright test e2e/settings-localization.spec.ts e2e/settings-role-localization.spec.ts e2e/calendar-removal-dialogs.spec.ts --project=phone-390x844 --project=tablet-portrait-800x1280 --project=fridge-landscape-1280x800
        env:
          E2E_SKIP_BUILD: "1"
          E2E_SETTINGS_QA: "enabled"
          E2E_REPORT_DIR: playwright-report/settings-${{ matrix.mode }}-enabled
          E2E_OUTPUT_DIR: test-results/settings-${{ matrix.mode }}-enabled
      - name: ${{ matrix.mode }} unavailable Settings role gates
        run: npx playwright test e2e/settings-localization.spec.ts e2e/settings-role-localization.spec.ts e2e/calendar-removal-dialogs.spec.ts --project=phone-390x844 --project=tablet-portrait-800x1280 --project=fridge-landscape-1280x800
        env:
          E2E_SKIP_BUILD: "1"
          E2E_SETTINGS_QA: "unavailable"
          E2E_REPORT_DIR: playwright-report/settings-${{ matrix.mode }}-unavailable
          E2E_OUTPUT_DIR: test-results/settings-${{ matrix.mode }}-unavailable
      - name: Preserve ${{ matrix.mode }} Settings proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: settings-${{ matrix.mode }}-qa-${{ github.sha }}
          path: |
            playwright-report/settings-${{ matrix.mode }}-enabled/
            test-results/settings-${{ matrix.mode }}-enabled/
            playwright-report/settings-${{ matrix.mode }}-unavailable/
            test-results/settings-${{ matrix.mode }}-unavailable/
          if-no-files-found: error
          retention-days: 7

  profile_routine:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cloudflare_only != true }}
    name: Email-free profile routine QA (six viewports)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # This is a separate opt-in build and disposable database. It exercises
    # the real profile vertical only; ordinary journeys and visual baselines
    # remain owned by the jobs above.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fp_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fp_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Loopback + disposable name: accepted by the fixture guard.
      DATABASE_URL: postgresql://postgres@localhost:5432/fp_e2e_ci
      FIXTURES_ALLOW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_SHA: ${{ github.sha }}
      # These flags are intentionally scoped to this hosted disposable job.
      HOUSEHOLD_PROFILE_SETUP_ENABLED: "1"
      HOUSEHOLD_PROFILE_CHORE_ENABLED: "1"
      HOUSEHOLD_PROFILE_CHORE_ROLLBACK_READY: "1"
      HOUSEHOLD_PROFILE_CHORE_RECURRENCE_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate database
        run: node scripts/migrate.js
      - name: Build profile routine application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
      - name: Run real email-free profile routine journeys
        run: >-
          npx playwright test e2e/profile-chore-vertical.spec.ts
          --project=phone-390x844
          --project=phone-430x932
          --project=tablet-portrait-800x1280
          --project=fridge-landscape-1280x800
          --project=tablet-large-1920x1200
          --project=desktop-1366x768
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/profile-routine
          E2E_OUTPUT_DIR: test-results/profile-routine
      - name: Preserve profile routine proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-routine-qa-${{ github.sha }}
          path: |
            playwright-report/profile-routine/
            test-results/profile-routine/
          if-no-files-found: error
          retention-days: 7

  review_documents:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cloudflare_only != true }}
    name: Adopted Capture recovery QA (six viewports)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # This is a separate opt-in build and disposable database. It exercises
    # the real owned Capture journal only; ordinary journeys and visual baselines
    # remain owned by the jobs above.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fp_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fp_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Loopback + disposable name: accepted by the fixture guard.
      DATABASE_URL: postgresql://postgres@localhost:5432/fp_e2e_ci
      FIXTURES_ALLOW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_SHA: ${{ github.sha }}
      # These flags are intentionally scoped to this hosted disposable job.
      QUEUE_OWNER_RECOVERY_ENABLED: "1"
      QUEUE_OWNER_RECOVERY_ROLLBACK_READY: "1"
      FAMILY_REVIEW_DOCUMENTS_READY: "1"
      FAMILY_REVIEW_DOCUMENTS_ROLLBACK_READY: "1"
      CAPTURE_AI_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate database
        run: node scripts/migrate.js
      - name: Build adopted review application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
      - name: Run provider-free owned Capture and inbox journeys
        run: >-
          npx playwright test --config=playwright.review-documents.config.ts
          --project=phone-390x844
          --project=phone-430x932
          --project=tablet-portrait-800x1280
          --project=fridge-landscape-1280x800
          --project=tablet-large-1920x1200
          --project=desktop-1366x768
        env:
          E2E_SKIP_BUILD: "1"
          E2E_REPORT_DIR: playwright-report/review-documents
          E2E_OUTPUT_DIR: test-results/review-documents
      - name: Preserve adopted review proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-documents-qa-${{ github.sha }}
          path: |
            playwright-report/review-documents/
            test-results/review-documents/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: E2E (Playwright)
    needs:
      [
        e2e,
        recovery_expanded,
        inventory_localization,
        settings_localization,
        profile_routine,
        review_documents,
      ]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.cloudflare_only != true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every isolated viewport shard and opt-in feature QA
        env:
          SHARD_RESULT: ${{ needs.e2e.result }}
          RECOVERY_RESULT: ${{ needs.recovery_expanded.result }}
          INVENTORY_RESULT: ${{ needs.inventory_localization.result }}
          SETTINGS_RESULT: ${{ needs.settings_localization.result }}
          PROFILE_ROUTINE_RESULT: ${{ needs.profile_routine.result }}
          REVIEW_DOCUMENTS_RESULT: ${{ needs.review_documents.result }}
        run: test "$SHARD_RESULT" = success && test "$RECOVERY_RESULT" = success && test "$INVENTORY_RESULT" = success && test "$SETTINGS_RESULT" = success && test "$PROFILE_ROUTINE_RESULT" = success && test "$REVIEW_DOCUMENTS_RESULT" = success

  cloudflare_build:
    name: Cloudflare build and bundle measurement
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cloudflare_only == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      NEXT_PUBLIC_APP_URL: https://herewoven.com
      HEREWOVEN_STORAGE: d1
      # Isolated build identity only; no production/provider secrets are used.
      JWT_SECRET: fabricated-cloudflare-ci-build-key-not-production
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Record source identity
        env:
          RUNTIME_ARTIFACT_REQUESTED: ${{ inputs.retain_cloudflare_runtime }}
        run: |
          mkdir -p cloudflare-readiness
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const requested = process.env.RUNTIME_ARTIFACT_REQUESTED === 'true'
          const privatePasswordComputeFiles = [
            'src/cloudflare/password-compute-worker.ts',
            'src/lib/cloudflare/password-compute-do.ts',
            'src/lib/cloudflare/local-password-compute.ts',
            'wrangler.password-compute.jsonc',
            'package-lock.json',
          ]
          const privatePasswordCompute = Object.fromEntries(
            privatePasswordComputeFiles.map(file => [
              file,
              crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),
            ]),
          )
          fs.writeFileSync('cloudflare-readiness/source.json', `${JSON.stringify({
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            storage: 'd1',
            deployment: false,
            runtimeArtifact: {
              requested,
              retentionDays: requested ? 7 : null,
              contents: requested ? ['worker.bundle', '.open-next/assets', 'source.json'] : [],
              privatePasswordCompute: {
                algorithm: 'sha256',
                files: privatePasswordCompute,
              },
            },
          }, null, 2)}\n`, { mode: 0o600 })
          NODE
      - name: Generate existing database client types
        # Retained PostgreSQL modules still need their generated types while
        # D1 routes are ported. Generation does not connect to a database.
        run: npx prisma generate
      - name: Build Worker without deployment
        shell: bash
        run: |
          set -o pipefail
          npm run cloudflare:build 2>&1 | tee cloudflare-readiness/build.log
      - name: Measure upload bundle without deployment
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outfile cloudflare-readiness/worker.bundle 2>&1 | tee cloudflare-readiness/bundle.log
      - name: Profile local startup and write safe bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare/readiness-summary.mjs \
            --bundle-file cloudflare-readiness/worker.bundle \
            --assets-dir .open-next/assets \
            --summary-out cloudflare-readiness/bundle-summary.json \
            --startup-out cloudflare-readiness/startup-summary.json \
            --runtime-artifact-retained "${{ inputs.retain_cloudflare_runtime }}"
      - name: Package ephemeral local Cloudflare runtime (opt-in)
        if: ${{ inputs.retain_cloudflare_runtime == true }}
        shell: bash
        run: |
          set -euo pipefail
          bundle='cloudflare-readiness/worker.bundle'
          source='cloudflare-readiness/source.json'
          assets='.open-next/assets'
          archive='cloudflare-readiness/herewoven-local-runtime.tar.gz'
          test -s "$bundle"
          test -s "$source"
          test -d "$assets"

          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/.open-next/assets"
          cp -- "$bundle" "$stage/worker.bundle"
          cp -- "$source" "$stage/source.json"
          # Copy only deployable static assets. Maps, env files and dependency
          # trees are deliberately excluded from the retained local archive.
          tar -C "$assets" \
            --exclude='*.map' \
            --exclude='node_modules' \
            --exclude='node_modules/*' \
            --exclude='.env' \
            --exclude='.env.*' \
            -cf - . | tar -C "$stage/.open-next/assets" -xf -

          tar -C "$stage" \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" worker.bundle source.json .open-next/assets
          listing="$(tar -tzf "$archive")"
          if printf '%s\n' "$listing" | grep -Eiq '(^|/)(node_modules|[^/]*\.map$|\.env($|\.)|[^/]*\.env($|\.))'; then
            echo 'Refusing to retain an unsafe runtime archive' >&2
            exit 1
          fi
          test "$(printf '%s\n' "$listing" | grep -Ec '(^|/)worker\.bundle$')" -eq 1
          test "$(printf '%s\n' "$listing" | grep -Ec '(^|/)source\.json$')" -eq 1
      - name: Upload source and build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-readiness-${{ github.sha }}
          path: |
            cloudflare-readiness/source.json
            cloudflare-readiness/bundle-summary.json
            cloudflare-readiness/startup-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload ephemeral local Cloudflare runtime
        if: ${{ inputs.retain_cloudflare_runtime == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-local-runtime-${{ github.sha }}
          path: cloudflare-readiness/herewoven-local-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
