name: Build and Push Image

# Reusable build workflow for camster91/* Node.js web apps.
# Triggered on push to main and on tag. Builds a multi-stage Docker image
# and pushes it to ghcr.io. The image becomes the canonical deployable
# artifact — any host (Coolify, Hostinger, Render, Fly, local docker) can
# run it without needing source code, Node, or build tools on the host.
#
# Conventions:
#   - Image: ghcr.io/camster91/<repo>:main (or :<tag> for releases)
#   - Default platform: linux/amd64, matching the Ashbi/Coolify runtime.
#     Reusable callers can still request additional architectures explicitly.
#   - Buildx cache pushed to GHCR type=cache (saves ~3min per build)
#   - SBOM + provenance attestations enabled (for supply-chain trust)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_call:
    inputs:
      image_name:
        description: 'Override image name (default: repo name)'
        required: false
        type: string
      dockerfile:
        description: 'Path to Dockerfile (default: ./Dockerfile)'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Buildx platforms (default: Ashbi amd64 runtime)'
        required: false
        type: string
        default: 'linux/amd64'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build deployable image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}
      candidate-sha: ${{ steps.meta.outputs.candidate-sha }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Resolve image metadata
        id: meta
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -n "${{ inputs.image_name }}" ]; then REPO_NAME="${{ inputs.image_name }}"; fi
          IMAGE="ghcr.io/camster91/${REPO_NAME}"
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          elif [[ "$REF" == refs/heads/main || "$REF" == refs/heads/master ]]; then
            TAG="main"
          elif [[ "$REF" == refs/pull/* ]]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          else
            TAG="${REF#refs/heads/}"
          fi
          SHA_SHORT="${CANDIDATE_SHA:0:7}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "sha=${SHA_SHORT}"
            echo "candidate-sha=${CANDIDATE_SHA}"
            echo "artifact-name=family-planner-pr-${{ github.event.pull_request.number }}-${SHA_SHORT}"
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}:${TAG}-${SHA_SHORT}"
            if [[ "$REF" != refs/pull/* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-buildx-main
            ${{ runner.os }}-buildx-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile || 'Dockerfile' }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          # PR tokens cannot access the existing GHCR package. Produce a
          # downloadable OCI artifact for review; merged refs publish to GHCR.
          push: ${{ github.event_name != 'pull_request' }}
          outputs: ${{ github.event_name == 'pull_request' && format('type=docker,dest=/tmp/family-planner-{0}.tar', env.CANDIDATE_SHA) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ env.CANDIDATE_SHA }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Upload exact PR image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: /tmp/family-planner-${{ env.CANDIDATE_SHA }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Image summary
        run: |
          {
            echo "## Deployable image prepared"
            echo ""
            echo "**Image:** \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "**Pull:** \`docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "**Run:** \`docker run -d -p 3000:3000 --name ${{ github.event.repository.name }} ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "**Platforms:** ${{ inputs.platforms || 'linux/amd64' }}"
            echo "**SHA:** ${{ steps.meta.outputs.sha }}"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "**Delivery:** exact-head OCI workflow artifact (7-day retention; GHCR latest unchanged)"
            else
              echo "**Delivery:** GHCR"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-review:
    name: Deploy exact image to Ashbi review
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'deploy-review')
    runs-on: [self-hosted, linux, x64, ashbi, family-planner]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.candidate-sha }}

      - name: Download exact review image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: /tmp/family-planner-review-${{ needs.build.outputs.candidate-sha }}

      - name: Deploy with backup and rollback
        run: >-
          bash scripts/deploy-review-artifact.sh
          /tmp/family-planner-review-${{ needs.build.outputs.candidate-sha }}/family-planner-${{ needs.build.outputs.candidate-sha }}.tar
          ${{ needs.build.outputs.candidate-sha }}

      - name: Remove downloaded review artifact
        if: always()
        run: rm -f /tmp/family-planner-review-${{ needs.build.outputs.candidate-sha }}/family-planner-${{ needs.build.outputs.candidate-sha }}.tar
