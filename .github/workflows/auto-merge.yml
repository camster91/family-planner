name: Auto Merge
on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, opened, edited, reopened]
permissions: {}
jobs:
  auto-merge:
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/automerge-action@d1203c0bf94a827b991e5de69d662e9163304fa0 # v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "auto-merge"
          MERGE_DELETE_BRANCH: true
          MERGE_FORKS: false
          MERGE_METHOD: squash
          MERGE_RETRIES: 5
          MERGE_RETRY_SLEEP: 60000
