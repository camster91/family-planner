<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herewoven · connected workflow study</title>
<style>
@font-face{font-family:Manrope;src:local(Manrope)}*{box-sizing:border-box}body{margin:0;background:#F7F4EC;color:#182D2A;font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.5}button,input,select{font:inherit}button,a,summary{touch-action:manipulation}button,select,input{min-height:44px;border-radius:12px;border:1px solid #75877D;padding:10px 14px;background:#fffdf9;color:inherit}button,summary{cursor:pointer}button:hover{background:#e7ede7}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #245B50;outline-offset:3px}button.primary{background:#245B50;color:white;border-color:#245B50}button.quiet{border-color:transparent;background:transparent}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,serif;font-weight:500;line-height:1.2}h1{font-size:36px}h2{font-size:26px}h3{font-size:18px}.muted,small{color:#53665E}small{font-size:13px}.study{background:#182D2A;color:#fffdf9;padding:6px 24px;font-size:12px;letter-spacing:.02em}.shell{display:flex;align-items:center;gap:32px;padding:14px 32px;border-bottom:1px solid #ddd9ce;background:#fffdf9}.brand{font:28px Georgia;display:flex;gap:10px;align-items:center}.brand img{width:40px;height:40px}.nav{display:flex;gap:6px;flex:1}.nav button{border:0;background:none;white-space:nowrap}.nav button[aria-current=page]{background:#e7ede7;color:#245B50;font-weight:700}.account{border-radius:50%;background:#e7ede7;width:44px;padding:0}.workspace{padding:28px 32px;max-width:1600px;margin:auto}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;color:#53665E}.actions,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.card{border:1px solid #ddd9ce;border-radius:24px;padding:24px;background:#fffdf9}.card+.card{margin-top:18px}.grid>.card,.calendar>.card{margin-top:0}.cardtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.item{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #e6ddcc}.item:last-child{border:0}.item .grow{flex:1;min-width:0}.time{font-size:14px;width:55px;flex-shrink:0}.tag{display:inline-block;background:#ede7f5;color:#51406b;padding:4px 9px;border-radius:8px;font-size:12px;margin-top:5px}.check{width:44px;padding:0;border-radius:50%}.toolbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}.segment{display:flex;gap:4px;background:#e9e7de;border-radius:14px;padding:4px}.segment button{border:0;background:none}.segment button[aria-pressed=true]{background:#fffdf9;box-shadow:0 1px 3px #182d2a18}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid #ddd9ce;border-radius:20px;overflow:hidden;background:#fffdf9}.day{padding:18px 12px;min-height:245px;border-right:1px solid #e6ddcc}.day:last-child{border:0}.day.active{background:#e7ede7}.day h3{font-size:14px;margin-bottom:20px}.day button{width:100%;margin-top:12px;text-align:left;border:1px dashed #75877d;background:transparent;padding:10px;font-size:14px}.dish{border-radius:12px;background:#f4eddb;padding:12px;font-size:14px}.lower{margin-top:24px;display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.calendar{display:grid;grid-template-columns:200px 1fr;gap:24px}.calendar .agenda{padding:0 24px}.agenda h3{padding-top:20px}.duration{font-size:13px;color:#53665e}.empty{padding:24px 0}.menu{position:relative}.menu summary{min-height:44px;padding:10px 14px;border:1px solid #75877D;border-radius:12px;list-style:none}.menu[open] .options{position:absolute;right:0;top:48px;z-index:3;min-width:220px;background:#fffdf9;border:1px solid #ddd9ce;border-radius:16px;padding:8px;box-shadow:0 12px 35px #182d2a22}.options button{width:100%;border:0;text-align:left}.notice{margin-top:20px;font-size:13px;color:#53665e}dialog{border:0;padding:0;border-radius:28px;max-width:860px;width:calc(100% - 48px);max-height:90dvh;background:#fffdf9;color:#182D2A;box-shadow:0 24px 100px #0003}dialog::backdrop{background:#182d2a88}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:24px;border-bottom:1px solid #e6ddcc}.dialog-body{padding:24px;max-height:calc(90dvh - 100px);overflow:auto}.context{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.context strong{font-size:15px}.chooser{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.recipe{border:1px solid #ddd9ce;border-radius:18px;overflow:hidden;background:#fffdf9}.food{height:100px;background:#e5eddf;display:flex;align-items:center;padding:20px;font:32px Georgia;color:#245B50}.recipe .body{padding:16px}.recipe button{margin-top:14px}.recipe p{margin:6px 0;font-size:14px}.search{display:flex;gap:8px;margin-top:18px}.search input{width:100%;min-width:0}.form label{display:grid;gap:6px;margin-bottom:16px}.form details{margin:20px 0}.form summary{min-height:44px;padding:10px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.ingredients{list-style:none;padding:0}.ingredients li{padding:10px 0;border-bottom:1px solid #e6ddcc}.ingredients input{min-height:20px;width:20px;vertical-align:middle;margin-right:8px}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#182D2A;color:white;padding:12px 20px;border-radius:14px;z-index:10;max-width:90%;box-shadow:0 4px 25px #0003}#toast:empty{display:none}a{color:#245B50}button:disabled{opacity:.6;cursor:wait}@media(max-width:1000px){.shell{gap:12px;padding:12px 20px}.brand{font-size:23px}.nav{gap:0}.nav button{padding:10px}.workspace{padding:24px}.week{grid-template-columns:repeat(4,1fr)}.day{min-height:200px;border-bottom:1px solid #e6ddcc}.grid{grid-template-columns:1.2fr 1fr}.calendar{grid-template-columns:160px 1fr}}
@media(max-width:650px){.study{padding:5px 16px}.shell{padding:10px 16px;justify-content:space-between}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9;border-top:1px solid #ddd9ce;padding:8px 6px;z-index:5;justify-content:space-around}.nav button{font-size:13px;padding:10px 9px}.workspace{padding:20px 16px 100px}.heading{align-items:flex-start;margin-bottom:20px}.heading h1{font-size:30px}.heading .actions{gap:4px}.grid,.calendar,.columns{grid-template-columns:1fr}.card{padding:20px;border-radius:20px}.cardtop h2{font-size:24px}.week{display:block;border:0;background:none}.day{min-height:0;border:1px solid #ddd9ce!important;border-radius:18px;margin-bottom:12px;padding:16px;background:#fffdf9;display:grid;grid-template-columns:85px 1fr;gap:8px}.day h3{margin:0}.day button{margin:0}.day .dish{grid-column:2}.calendar aside{display:none}.calendar .agenda{padding:0 20px}.chooser{grid-template-columns:1fr}.food{height:65px;font-size:26px}.segment{overflow:auto;max-width:100%}[data-recipe-modes]{display:grid;grid-template-columns:1fr 1fr;overflow:visible}[data-recipe-modes] button{font-size:14px}.segment button{white-space:nowrap;padding:8px 12px}.toolbar{gap:12px;margin-bottom:16px}.context{gap:8px}dialog{width:100%;max-width:none;max-height:94dvh;margin:auto 0 0;border-radius:24px 24px 0 0}.dialog-head{padding:18px 20px}.dialog-body{padding:20px;max-height:calc(94dvh - 88px)}.search button{padding:10px}.row{gap:8px}.lower{align-items:flex-start}.notice{font-size:12px}}
</style>
<body><div class="study">INTERACTIVE DESIGN STUDY · Fabricated household · Nothing is saved or searched online</div><header class="shell"><div class="brand"><img src="../../public/brand/woven-grove/logos/herewoven-symbol.svg" alt="">herewoven</div><nav class="nav" aria-label="Main navigation"></nav><button class="account" aria-label="Demo account" onclick="inform('Personal settings stay in the account menu.')">JD</button></header><main class="workspace" id="main"></main><dialog id="sheet" aria-labelledby="sheet-title"><div class="dialog-head"><h2 id="sheet-title"></h2><button class="quiet" aria-label="Close" onclick="sheet.close()">✕</button></div><div class="dialog-body" id="sheet-body"></div></dialog><div role="status" id="toast"></div>
<script>
const $=id=>document.getElementById(id), sheet=$('sheet');let current='Today',mode='Find recipes',chosen='',planned=false,done=false;let toastTimer;
const inform=t=>{$('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',4000)};
function modal(title,html){$('sheet-title').textContent=title;$('sheet-body').innerHTML=html;if(!sheet.open)sheet.showModal()}
const more=`<details class="menu"><summary aria-label="More options">•••</summary><div class="options"><button onclick="inform('Layout preferences belong here, in one place.')">Customize view</button><button onclick="inform('Demo content is already current.')">Refresh</button></div></details>`;
function show(page){current=page;document.querySelector('.nav').innerHTML=['Today','Calendar','Meals','Lists','Explore'].map(p=>`<button ${p===page?'aria-current="page"':''} onclick="show('${p}')">${p}</button>`).join('');$('main').innerHTML=page==='Today'?today():page==='Meals'?meals():page==='Calendar'?calendar():`<div class="heading"><h1>${page}</h1></div><div class="card"><h2>Outside this three-screen study</h2><p class="empty">Existing ${page.toLowerCase()} capabilities are retained. This study focuses on Today, Calendar and Meals.</p><button onclick="show('Today')">Back to Today</button></div>`;history.replaceState(null,'','#'+page.toLowerCase())}
function today(){return `<div class="heading"><div><p class="eyebrow">Today · Monday, November 2</p><h1>A little less to juggle.</h1></div><div class="actions"><button class="primary" onclick="quickAdd()">＋ Add</button>${more}</div></div><div class="grid"><section class="card"><div class="cardtop"><h2>Next up</h2><button class="quiet" onclick="show('Calendar')">Calendar →</button></div><div class="item"><span class="time">3:15<br>PM</span><div class="grow"><strong>School pickup</strong><p class="muted">Alex is picking up Sam</p><span class="tag">Bring the library book</span></div><button class="quiet" aria-label="Open school pickup" onclick="eventDetail()">→</button></div><div class="item"><button class="check" aria-label="${done?'Undo completed chore':'Complete pack school bag'}" onclick="done=!done;show('Today');inform(done?'Demo chore completed. Tap again to undo.':'Completion undone.')">${done?'✓':'○'}</button><div class="grow"><strong>${done?'School bag packed':'Pack school bag'}</strong><p class="muted">Sam · Evening routine</p></div></div><div class="item"><span class="time">6:00<br>PM</span><div class="grow"><strong>Dinner together</strong><p class="muted">${planned?escapeText(chosen):'Choose something everyone will enjoy'}</p></div></div></section><div><section class="card"><div class="cardtop"><h2>Dinner tonight</h2><span aria-hidden="true">◒</span></div><p class="muted">${planned?escapeText(chosen)+' · 4 servings':'Use what you have. Find something good.'}</p><div class="lower"><button class="primary" onclick="${planned?'groceryReview()':'chooseMeal()'}">${planned?'Review groceries':'Find dinner'}</button><button class="quiet" onclick="show('Meals')">Meal plan →</button></div></section><section class="card"><div class="cardtop"><h2>Shopping</h2><span class="muted">3 items</span></div><p>Milk, apples, dish soap</p><button class="quiet" style="margin-top:12px" onclick="inform('Production shortcut must open the actual household grocery list.')">Open grocery list →</button></section></div></div><section class="card" style="margin-top:20px"><div class="cardtop"><h2>Tomorrow</h2></div><p>9:00 AM · Dentist <span class="muted">— Alex</span></p></section>`}
function meals(){return `<div class="heading"><div><p class="eyebrow">Food & family</p><h1>Meals</h1></div><button class="primary" onclick="chooseMeal()">＋ Plan a meal</button></div><div class="toolbar"><div class="segment" aria-label="Meal view"><button aria-pressed="true" onclick="show('Meals')">Plan</button><button onclick="chooseMeal()">Recipes</button><button onclick="prep()">Prep</button></div><button class="quiet" onclick="inform('Inventory opens with the current planning context preserved.')">Fridge & pantry →</button></div><div class="cardtop"><h3>November 2–8</h3><div class="row"><button aria-label="Previous week" onclick="inform('Week navigation retains the selected date in production.')">←</button><button aria-label="Next week" onclick="inform('Week navigation retains the selected date in production.')">→</button></div></div><div class="week">${['Mon 2','Tue 3','Wed 4','Thu 5','Fri 6','Sat 7','Sun 8'].map((d,i)=>`<section class="day ${i===0?'active':''}"><h3>${i===0?'Today':d}</h3>${i===0&&planned?'<div class="dish"><strong>'+escapeText(chosen)+'</strong><p>4 servings</p></div>':i===2?'<div class="dish"><strong>Veggie pasta</strong><p>Jamie · Dinner</p></div>':`<button onclick="chooseMeal('${d}')">＋ Dinner</button>`}</section>`).join('')}</div><div class="lower"><p class="muted">Planning a few dishes together?</p><button onclick="prep()">Start a prep session →</button></div>`}
function calendar(){return `<div class="heading"><div><p class="eyebrow">Family calendar</p><h1>November 2–8</h1></div><button class="primary" onclick="eventDetail()">＋ Event</button></div><div class="toolbar"><div class="row"><button aria-label="Previous week" onclick="inform('Previous week — navigation study')">←</button><button onclick="inform('Showing the demo week.')">Today</button><button aria-label="Next week" onclick="inform('Next week — navigation study')">→</button></div><div class="row"><div class="segment"><button aria-pressed="true" onclick="inform('Agenda adapts to narrow screens.')">Agenda</button><button onclick="inform('Week grid retains this same toolbar and event details; grid is outside this study.')">Week</button></div><details class="menu"><summary>Calendars</summary><div class="options"><button onclick="inform('Family calendar selected.')">✓ Family</button><button onclick="inform('Connections open here without leaving the selected week.')">＋ Connect a calendar</button><button onclick="inform('Import and capture share the existing review flow.')">Import or scan</button></div></details></div></div><div class="calendar"><aside class="card"><h3>This week</h3><p class="empty muted">2 events<br>1 pickup</p><small>Monday · School pickup<br>Tuesday · Dentist</small></aside><section class="card agenda"><h3>Monday 2</h3><div class="item"><span class="time">3:15<br>PM</span><div class="grow"><strong>School pickup</strong><p class="duration">30 min · Alex & Sam</p></div><button class="quiet" aria-label="Open pickup details" onclick="eventDetail()">→</button></div><h3>Tuesday 3</h3><div class="item"><span class="time">9:00<br>AM</span><div class="grow"><strong>Dentist</strong><p class="duration">45 min · Alex</p></div><button class="quiet" aria-label="Open dentist details" onclick="inform('Event details reuse the same editor and duration controls.')">→</button></div><p class="empty muted">The rest of the week is clear.</p></section></div>`}
let day='Mon 2';function chooseMeal(date){if(date)day=date;mode='Find recipes';chooser()}
function chooser(){modal('What’s for dinner?',`<div class="context"><strong>${day} · Dinner</strong><button class="quiet" onclick="changeContext()">Change</button></div><div class="segment" aria-label="Recipe source" data-recipe-modes>${['Find recipes','Saved','Paste link','Quick meal'].map(m=>`<button aria-pressed="${m===mode}" onclick="mode='${m}';chooser()">${m}</button>`).join('')}</div>${mode==='Find recipes'||mode==='Saved'?`<form class="search" onsubmit="event.preventDefault();inform('Illustrative results only — no online search is connected.')"><input aria-label="Search recipes" placeholder="Try chicken, pasta or a quick dinner"><button class="primary">Search</button></form><div class="chooser">${['Lemon chickpea bowls','Roasted vegetable pasta'].map((r,i)=>`<article class="recipe"><div class="food">${i?'Something comforting':'Fresh & simple'}</div><div class="body"><h3>${r}</h3><p class="muted">Demo recipe · ${i?'35':'25'} min · 4 servings</p><button onclick="chosen='${r}';preview()">Preview recipe →</button></div></article>`).join('')}</div><p class="notice">Illustrative recipes. Real results must show their publisher and verified available details.</p>`:mode==='Paste link'?`<form class="form" style="margin-top:20px" onsubmit="event.preventDefault();inform('Production preview validates the URL and source before import.')"><label>Recipe link<input type="url" required placeholder="https://…"></label><button class="primary">Preview link</button></form>`:`<form class="form" style="margin-top:20px" onsubmit="event.preventDefault();chosen=$('quick-name').value;confirmMeal()"><label>What are you having?<input id="quick-name" required placeholder="e.g. Takeaway or sandwiches"></label><button class="primary">Continue</button></form>`}`)}
function changeContext(){modal('When is this meal?',`<form class="form" onsubmit="event.preventDefault();day=$('meal-date').value;chooser()"><label>Date<input type="date" id="meal-date" value="2026-11-02" required></label><p class="muted">Dinner · Context is kept while you choose a recipe.</p><button class="primary" style="margin-top:20px">Done</button></form>`)}
function escapeText(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function preview(){modal(chosen,`<button class="quiet" onclick="chooser()">← Results</button><p class="muted" style="margin:12px 0 24px">Illustrative recipe · 25 minutes · 4 servings</p><div class="columns"><section><h3>Ingredients</h3><ul class="ingredients"><li>Chickpeas</li><li>Rice</li><li>Lemon</li><li>Leafy greens</li></ul></section><section><h3>At a glance</h3><p style="margin-top:12px">Cook the rice, prepare the vegetables and assemble the bowls.</p><p class="notice">A real preview must retain the publisher link and available instructions.</p></section></div><div class="lower"><button class="primary" onclick="confirmMeal()">Plan this meal</button><button onclick="inform('Demo favorite selected; nothing is persisted.')">♡ Save for later</button></div>`)}
function confirmMeal(){modal('Plan your meal',`<form class="form" onsubmit="event.preventDefault();finishMeal()"><h3>${escapeText(chosen)}</h3><p class="muted" style="margin:8px 0 20px">${escapeText(day)} · Dinner</p><label>Servings<input id="servings" type="number" min="1" max="50" value="4" required></label><details><summary>Cook & notes</summary><label>Cook<select><option>Unassigned</option><option>Jamie</option><option>Alex</option></select></label><label>Notes<input placeholder="Anything to remember?"></label></details><button class="primary">Add to meal plan</button></form>`)}
function finishMeal(){planned=true;modal('Meal added to the demo plan',`<p>Your selection stays linked to its recipe.</p><div class="lower"><button class="primary" onclick="groceryReview()">Review groceries</button><button onclick="returnToPlan()">Back to plan</button></div><p class="notice">Prototype confirmation only. No household records were changed.</p>`)}
function returnToPlan(){sheet.close();show('Meals')}
function groceryReview(){modal('Check what you need',`<p class="muted">Review before adding. Pantry quantities can be out of date.</p><ul class="ingredients"><li><label><input type="checkbox" checked> Chickpeas · 2 cans</label></li><li><label><input type="checkbox" checked> Lemon · 1</label></li><li><label><input type="checkbox"> Rice · pantry amount needs checking</label></li></ul><button class="primary" onclick="sheet.close();show('Meals');inform('Demo groceries reviewed. No list or inventory was changed.')">Add selected to groceries</button>`)}
function prep(){modal('Cook once, plan several meals',`<p>Group dishes into a prep session, then track portions left and when to cook again.</p><div class="item"><div class="grow"><strong>Sunday prep</strong><p class="muted">Demo · 2 dishes · 8 portions planned</p></div></div><button class="primary" style="margin-top:20px" onclick="chooseMeal()">Choose a dish</button><p class="notice">Detailed prep/consumption states remain in the next workflow study.</p>`)}
function eventDetail(){modal('School pickup',`<p class="muted">Monday · 3:15 PM · 30 minutes</p><div class="item"><div><strong>Alex is picking up Sam</strong><p class="muted">School · Family calendar</p></div></div><div class="item"><div><strong>Before you leave</strong><p>Bring the library book.</p></div></div><button class="primary" style="margin-top:20px" onclick="sheet.close();inform('Event detail reviewed. Editing is outside this composition study.')">Done</button>`)}
function quickAdd(){modal('What would you like to add?',`<div class="row"><button onclick="eventDetail()">Event</button><button onclick="inform('Chore creation keeps its existing schedule and assignment rules.')">Chore</button><button onclick="chooseMeal()">Meal</button><button onclick="inform('List capture opens the selected canonical list.')">List item</button></div><p class="notice">Direct actions first. Optional assistant entry belongs here, without another floating button.</p>`)}
function route(){show(({today:'Today',meals:'Meals',calendar:'Calendar'})[location.hash.slice(1)]||'Today')}window.addEventListener('hashchange',route);route();
</script></body></html>
