name: Stale Issues
# Manual only. AGENTS.md forbids scheduled jobs without Cameron's explicit
# approval for that specific scheduler, so there is no `schedule:` trigger.
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          stale-issue-message: "This issue has been inactive for 30 days. Auto-closing."
          days-before-stale: 30
          days-before-close: 7
          # Issues only: never mark or close pull requests.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          exempt-issue-labels: pinned,security,enhancement
          operations-per-run: 50
