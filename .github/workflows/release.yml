name: Build, Test & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a production release. Build jobs have their own cancellable group.
concurrency:
  group: family-planner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: family-planner-build-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Disposable database for this isolated, ephemeral hosted job.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: familyplanner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d familyplanner_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      image_id: ${{ steps.package-image.outputs.image_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the secret scan below can read the commits of a PR or push.
          fetch-depth: 0

      # Secret scanning (#136). gitleaks is built from source with the runner's Go
      # toolchain: the module version is pinned and its content hash must equal
      # GITLEAKS_MODULE_SUM (the Go checksum database verifies it too). No token, no
      # licence key (the CLI never needs one; only the gitleaks-action does, and only for
      # organisation-owned repositories), no third-party action, no report or artifact
      # upload. Findings are printed with the secret redacted. Config and the narrow
      # test-fixture allowlist: .gitleaks.toml.
      - name: Scan for secrets
        env:
          GITLEAKS_MODULE: github.com/zricethezav/gitleaks/v8
          GITLEAKS_VERSION: v8.30.1 # tag commit 8d1f98c7967eb1e79cb44ac6241a124e145d2165
          GITLEAKS_MODULE_SUM: h1:PmEvCfVI7ti9dV3s5aMZUY7sS2GxRvG3yzih7E+cS3w=
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sum=$(go mod download -json "$GITLEAKS_MODULE@$GITLEAKS_VERSION" | jq -r .Sum)
          if [ "$sum" != "$GITLEAKS_MODULE_SUM" ]; then
            echo "::error::gitleaks module hash mismatch"
            exit 1
          fi
          GOBIN="$RUNNER_TEMP/gitleaks-bin" go install "$GITLEAKS_MODULE@$GITLEAKS_VERSION"
          scanner="$RUNNER_TEMP/gitleaks-bin/gitleaks"
          cd "$GITHUB_WORKSPACE"

          # 1. The checked-out tree.
          "$scanner" dir . --config .gitleaks.toml --redact --verbose --no-banner

          # 2. The commits this run adds: a secret added and then removed in a PR still leaks.
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Both are ancestors of the checked-out merge commit; fail rather than skip.
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git cat-file -e "$PR_HEAD_SHA^{commit}"
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && ! [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE_SHA..$GITHUB_SHA"
          fi
          if [ -n "$range" ]; then
            "$scanner" git . --config .gitleaks.toml --redact --verbose --no-banner --log-opts="$range"
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test -- --ci --runInBand --no-watchman
        env:
          CI: "true"

      - name: Verify database migrations are idempotent
        run: |
          node scripts/migrate.js
          node scripts/migrate.js
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/familyplanner_ci

      - name: Verify fixture seed is idempotent
        run: |
          npm run fixtures:seed
          npm run fixtures:seed
          npx jest src/lib/fixtures/__tests__/fixtures.integration.test.ts --ci --runInBand --no-watchman --forceExit
          npx jest src/lib/backfill/__tests__/meals-groceries.integration.test.ts --ci --runInBand --no-watchman --forceExit
          npm run fixtures:reset
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/familyplanner_ci
          FIXTURES_ALLOW: "1"
          RUN_DB_INTEGRATION: "1"

      - name: Test persisted family imports
        run: >-
          npx jest --ci --runInBand --no-watchman --forceExit
          src/lib/imports/__tests__/persistence.integration.test.ts
          src/lib/imports/__tests__/reconciliation.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/familyplanner_ci
          RUN_DB_INTEGRATION: "1"

      - name: Test database-backed routes and libraries
        run: >-
          npx jest --ci --runInBand --no-watchman --forceExit
          src/app/api/calendar/import-suggestions/__tests__/commit.integration.test.ts
          src/app/api/chores/__tests__/paging.integration.test.ts
          src/app/api/device/__tests__/device-writes.integration.test.ts
          src/app/api/family/__tests__/join-vs-deletion.integration.test.ts
          src/app/api/inventory/__tests__/adjustments.integration.test.ts
          src/app/api/inventory/__tests__/inventory.integration.test.ts
          src/app/api/lists/__tests__/from-recipe.integration.test.ts
          src/app/api/lists/__tests__/sections.integration.test.ts
          src/app/api/recipes/__tests__/recipes.integration.test.ts
          src/app/api/search/__tests__/search.integration.test.ts
          src/app/api/users/__tests__/preferences.integration.test.ts
          src/app/dashboard/today/__tests__/board-snapshot.integration.test.ts
          src/lib/__tests__/account-deletion.integration.test.ts
          src/lib/__tests__/beta-metrics.integration.test.ts
          src/lib/__tests__/device.integration.test.ts
          src/lib/__tests__/household-audit.integration.test.ts
          src/lib/__tests__/idempotency.integration.test.ts
          src/lib/__tests__/legacy-analytics.integration.test.ts
          src/lib/__tests__/list-item-delete.integration.test.ts
          src/lib/__tests__/list-item-provenance.integration.test.ts
          src/lib/__tests__/list-item-update.integration.test.ts
          src/lib/__tests__/membership-locks.integration.test.ts
          src/lib/calendar-import/__tests__/sync.integration.test.ts
          src/lib/calendar-sync/__tests__/sync.integration.test.ts
          src/lib/imports/__tests__/meal-planner-canonical.integration.test.ts
          src/lib/weather/__tests__/board-weather.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/familyplanner_ci
          RUN_DB_INTEGRATION: "1"

      # Backup -> restore -> compare -> migrate twice -> Prisma smoke on throwaway
      # fp_rehearsal_* databases in the CI service (#288). backup.sh/restore.sh
      # run through `docker exec` into the service container, as in production.
      - name: Rehearse backup restore and rollback-forward
        run: bash scripts/recovery-rehearsal.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          REHEARSAL_DB_CONTAINER: ${{ job.services.postgres.id }}
          REHEARSAL_RUN_ID: ci_${{ github.run_id }}_${{ github.run_attempt }}
          REHEARSAL_REPORT_DIR: ${{ runner.temp }}/recovery-rehearsal-report

      - name: Upload recovery rehearsal report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-rehearsal-report-${{ github.sha }}
          path: ${{ runner.temp }}/recovery-rehearsal-report
          if-no-files-found: warn
          retention-days: 30

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Build container image
        run: docker build --pull --build-arg "RELEASE_SHA=${GITHUB_SHA}" --tag "family-planner:${GITHUB_SHA}" .

      - name: Smoke test container readiness
        run: |
          FP_CHECKED_IMAGE="family-planner:${GITHUB_SHA}" bash .github/scripts/smoke-checked-image.sh

      - name: Verify checked-image transport guards
        run: python3 .github/scripts/test_checked_image.py

      - name: Preserve the checked image for a fresh runner
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/checked-image.py export --image "family-planner:${GITHUB_SHA}" --directory "$RUNNER_TEMP/checked-image"

      - name: Upload checked image and identity receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: family-planner-checked-image-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checked-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Package verified release image
        id: package-image
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        run: |
          set -euo pipefail
          image="family-planner:${GITHUB_SHA}"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected container image identity"
            exit 1
          fi
          release_dir="$RUNNER_TEMP/family-planner-release"
          mkdir -p "$release_dir"
          docker save --output "$release_dir/image.tar" "$image"
          cp .github/scripts/deploy-vps.sh "$release_dir/deploy-vps.sh"
          tar -czf "$release_dir/release-bundle.tar.gz" -C "$release_dir" image.tar deploy-vps.sh
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Upload verified release image
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: family-planner-release-${{ github.sha }}
          path: ${{ runner.temp }}/family-planner-release/release-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1

  checked-image:
    name: Checked image on fresh runner
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download checked image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: family-planner-checked-image-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checked-image/
      - name: Verify archive and loaded runtime identity
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/checked-image.py load --directory "$RUNNER_TEMP/checked-image"
      - name: Exercise imported runtime on disposable database
        env:
          FP_CHECKED_IMAGE: family-planner-checked-runtime:${{ github.sha }}
        run: bash .github/scripts/smoke-checked-image.sh

  release:
    name: Release to VPS
    needs: [build, checked-image]
    # Production credentials are only available to a manually dispatched run on
    # the actual default branch. Pull requests and ordinary pushes never deploy.
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    concurrency:
      group: family-planner-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified release image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: family-planner-release-${{ github.sha }}
          path: ${{ runner.temp }}/family-planner-release

      - name: Deploy exact verified image over pinned SSH
        env:
          FP_SSH_HOST: ${{ vars.FP_SSH_HOST }}
          FP_SSH_USER: ${{ vars.FP_SSH_USER }}
          FP_SSH_PORT: ${{ vars.FP_SSH_PORT }}
          FP_SSH_PRIVATE_KEY: ${{ secrets.FP_SSH_PRIVATE_KEY }}
          FP_SSH_KNOWN_HOSTS: ${{ secrets.FP_SSH_KNOWN_HOSTS }}
          FP_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          bash ./.github/scripts/deploy-over-ssh.sh \
            "$GITHUB_SHA" \
            "$FP_IMAGE_ID" \
            "$RUNNER_TEMP/family-planner-release/release-bundle.tar.gz"

      - name: Verify public route serves the released commit
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          for attempt in $(seq 1 6); do
            : > "$headers"
            code="$(curl --silent --show-error --max-time 15 \
              --header 'Cache-Control: no-cache' \
              --dump-header "$headers" --output /dev/null \
              --write-out '%{http_code}' \
              https://family.ashbi.ca/api/health || true)"
            served_sha="$(awk 'tolower($1) == "x-release-commit:" { gsub("\r", "", $2); print $2 }' "$headers" | tail -n 1)"
            if [ "$code" = "200" ] && [ "$served_sha" = "$GITHUB_SHA" ]; then
              echo "Public health route serves verified commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::public health route did not serve the verified release commit"
          exit 1
